name: Try to Create OCI VM
# Loop-retry tiap 60 detik per run (maks ~25 menit), heartbeat Discord tiap ~10 menit.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: oci-create-vm
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: "ocid1.image.oc1.ap-batam-1.aaaaaaaaedlako7qbzghuptwkdplqthztwmfseqmk4qa7kefjhwwbxh5nbcq"
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: "QXhp:AP-BATAM-1-AD-1"
  OCI_CLI_REGION: "ap-batam-1"
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Loop-Create VM
        run: |
          set -o pipefail
          pip install oci-cli -q

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=${{ env.OCI_CLI_REGION }}" >> ~/.oci/config
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          WEBHOOK="${{ secrets.DISCORD_WEBHOOK_URL }}"
          notify() { curl -s -H "Content-Type: application/json" -X POST -d "$(jq -nc --arg c "$1" '{content:$c}')" "$WEBHOOK" >/dev/null 2>&1 || true; }

          MAX_MIN=25
          HEARTBEAT_EVERY=10
          ATTEMPT=0
          END=$(( $(date +%s) + MAX_MIN*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            ATTEMPT=$((ATTEMPT+1))
            OUT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "daily-pass" \
              --boot-volume-size-in-gbs 50 2>&1 || true)
            if echo "$OUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              notify "BERHASIL! Instance ARM Batam ke-create (attempt #$ATTEMPT). Buka OCI Console, cek Public IP, lalu MATIKAN workflow ini."
              echo "SUCCESS at attempt $ATTEMPT"
              exit 0
            fi
            MSG=$(echo "$OUT" | grep -o '"message": "[^"]*"' | head -1 | sed 's/"message": //; s/"//g')
            if [ $((ATTEMPT % HEARTBEAT_EVERY)) -eq 0 ]; then
              notify "Masih hunting kapasitas Batam (attempt #$ATTEMPT, run masih jalan). Terakhir: ${MSG:-unknown}"
            fi
            sleep 60
          done
          notify "Run selesai (${ATTEMPT}x attempt, belum dapat slot). Run berikutnya lanjut otomatis."
          echo "no capacity this run after $ATTEMPT attempts"
